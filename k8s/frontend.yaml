apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-backend
          image: worddeck-frontend:1.0.0
          imagePullPolicy: Never
          command: ["sh", "-c", "until nslookup backend.worddeck.svc.cluster.local; do sleep 2; done"]
      containers:
        - name: frontend
          image: worddeck-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
